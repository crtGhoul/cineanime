<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a34"/>
      <stop offset="100%" stop-color="#b80009"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#e50914" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Full-bleed Background for Squircle & Circle Masks -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="100" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="4"/>
  
  <!-- Centered Safe-Zone Rounded Badge (fits inside standard 80% safe circle) -->
  <rect x="136" y="136" width="240" height="240" rx="64" fill="url(#redGrad)" filter="url(#shadow)"/>
  <rect x="140" y="140" width="232" height="232" rx="60" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="4"/>
  
  <!-- Perfectly Centered Play Triangle -->
  <path d="M232 206 L316 256 L232 306 Z" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.35))"/>
  
  <!-- Accent Sparkle within safe zone -->
  <circle cx="348" cy="164" r="12" fill="#ffd700" filter="drop-shadow(0 0 6px #ffd700)"/>
</svg>
