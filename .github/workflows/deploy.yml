name: Deploy CineAnime Pages & Build Android TV APK

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-tv"
  cancel-in-progress: false

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage static web bundle
        run: |
          mkdir -p _site
          for f in index.html about.html sw.js servers.json manifest.webmanifest robots.txt icon.svg icon-192.png icon-512.png CineAnime-v1.0.0-tv.apk CineAnime-v1.0.0-windows-x64.zip; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d "vendor" ]; then cp -r vendor _site/vendor; fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-tv-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Ensure Android SDK 34 Build Tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          ls -la "$SDK/build-tools" "$SDK/platforms" || true
          if [ ! -d "$SDK/build-tools/34.0.0" ] || [ ! -d "$SDK/platforms/android-34" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            (yes || true) | "$SM" --licenses > /dev/null
            "$SM" "build-tools;34.0.0" "platforms;android-34"
          fi
      - name: Build Signed CineAnime Android TV APK
        shell: pwsh
        run: |
          ./android-tv/build.ps1
      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineAnime-v1.0.0-tv.apk
          path: android-tv/dist/CineAnime-v1.0.0-tv.apk
          if-no-files-found: error
      - name: Publish Signed TV APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-tv
          name: CineAnime Android TV Shell (v1.0.0)
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Auto-updating Android TV WebView Wrapper APK for Chromecast with Google TV & Onn Google TV.
            Points live to https://crtghoul.github.io/cineanime/ so every web commit updates automatically!
          files: android-tv/dist/CineAnime-v1.0.0-tv.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
